#
# Auto-generated JWS signing certificate for registry-center.
# On first install: generates new self-signed certificate.
# On upgrade: preserves existing certificate (via lookup).
# To use custom certificate: set registry.signing.mode=secret.
#
# Contract with the image (registry-center server.conf defaults):
#   jwk_cert_path=etc/sign_cert/sign.cer
#   jwk_private_key_path=etc/sign_cert/sign_key.pem
#   jwk_private_key_password=  (empty - the Helm-generated key is unencrypted;
#     the configmap sets REGISTRY_JWK_PRIVATE_KEY_PASSWORD="" accordingly.
#     An empty password FILE would read as b'' and crash the signer.)

{{ if and .Values.registry.enabled (eq .Values.registry.signing.mode "auto") }}
{{ $existingSigning := lookup "v1" "Secret" .Values.namespace "registry-center-signing" }}
{{ if $existingSigning }}
# Reuse existing signing certificate to preserve JWS signature compatibility.
# Fall back to the legacy key names (server.cer/server_key.pem) so upgrading
# an old release repairs the broken material instead of keeping it.
apiVersion: v1
kind: Secret
metadata:
  name: registry-center-signing
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.registry.labels" . | nindent 4 }}
type: Opaque
data:
  sign.cer: {{ index $existingSigning.data "sign.cer" | default (index $existingSigning.data "server.cer") }}
  sign_key.pem: {{ index $existingSigning.data "sign_key.pem" | default (index $existingSigning.data "server_key.pem") }}
{{ else }}
{{ $ca := genCA "OpenAN CA" 3650 }}
{{ $signingCert := genSignedCert "registry-center-signing" nil nil 3650 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: registry-center-signing
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.registry.labels" . | nindent 4 }}
type: Opaque
data:
  sign.cer: {{ $signingCert.Cert | b64enc }}
  sign_key.pem: {{ $signingCert.Key | b64enc }}
{{ end }}
{{ end }}
