{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openan-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "openan.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openan.frontend.selectorLabels" . | nindent 8 }}
    spec:
      {{- if eq (include "openan.frontendType" .) "workflow-designer" }}
      initContainers:
        # The stock nginx entrypoint renders /etc/nginx/templates/*.template
        # into /etc/nginx/conf.d/, which fails when a ConfigMap is mounted
        # there read-only. Render into an emptyDir instead and hand that to
        # nginx; fall back to the chart's own config when the image ships no
        # template directory.
        - name: render-nginx-config
          image: "{{ include "openan.frontendImageRepository" . }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          env:
            - name: BACKEND_SCHEME
              value: {{ include "openan.httpScheme" . | quote }}
            - name: BACKEND_HOST
              value: "orchestration-center"
            - name: BACKEND_PORT
              value: "5001"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -f /etc/nginx/templates/default.conf.template ]; then
                SRC=/etc/nginx/templates/default.conf.template
              elif [ -f /cm/default.conf ]; then
                cp /cm/default.conf /rendered/default.conf
                echo "using ConfigMap-provided default.conf"
                exit 0
              else
                echo "no nginx template or configmap found" >&2; exit 1
              fi
              if command -v envsubst >/dev/null 2>&1; then
                envsubst '${BACKEND_SCHEME} ${BACKEND_HOST} ${BACKEND_PORT}' < "$SRC" > /rendered/default.conf
              else
                sed -e "s|\${BACKEND_SCHEME}|${BACKEND_SCHEME}|g" \
                    -e "s|\${BACKEND_HOST}|${BACKEND_HOST}|g" \
                    -e "s|\${BACKEND_PORT}|${BACKEND_PORT}|g" \
                    "$SRC" > /rendered/default.conf
              fi
              echo "rendered default.conf:"
              grep -n 'proxy_pass' /rendered/default.conf
          volumeMounts:
            - name: nginx-conf-rendered
              mountPath: /rendered
            - name: nginx-config-cm
              mountPath: /cm
      {{- end }}
      {{- if eq (include "openan.frontendType" .) "portal" }}
      initContainers:
        # The portal JS hardcodes 127.0.0.1:5001/5000 as backend defaults
        # (read from localStorage server_config); the BACKEND_URL env var only
        # configures the nginx proxy, not the JS. Copy the image's HTML to an
        # emptyDir and patch the defaults to the in-cluster service addresses
        # (field-verified bug; the proper fix belongs in the portal source).
        - name: patch-portal-defaults
          image: "{{ include "openan.frontendImageRepository" . }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cp -r /usr/share/nginx/html/. /patched/
              find /patched -name '*.js' -exec sed -i \
                -e 's|127\.0\.0\.1:5001|orchestration-center:{{ .Values.orchestration.port }}|g' \
                -e 's|127\.0\.0\.1:5000|registry-center:{{ .Values.registry.port }}|g' \
                {} +
              echo "portal JS defaults patched to in-cluster services"
          volumeMounts:
            - name: portal-html
              mountPath: /patched
      {{- end }}
      containers:
        - name: openan-frontend
          image: "{{ include "openan.frontendImageRepository" . }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          {{- if eq (include "openan.frontendType" .) "portal" }}
          # The portal image renders its nginx config itself (envsubst template
          # shipped in the image); the chart only provides the upstream URLs.
          env:
            - name: BACKEND_URL
              value: {{ include "openan.httpScheme" . }}://orchestration-center:{{ .Values.orchestration.port }}
            - name: REGISTRY_URL
              value: {{ include "openan.httpScheme" . }}://registry-center:{{ .Values.registry.port }}
          {{- end }}
          ports:
            - containerPort: {{ include "openan.frontendContainerPort" . }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ dig "path" "/" .Values.frontend.livenessProbe.httpGet }}
              port: {{ include "openan.frontendContainerPort" . }}
            {{- toYaml (omit .Values.frontend.livenessProbe "httpGet") | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ dig "path" "/" .Values.frontend.readinessProbe.httpGet }}
              port: {{ include "openan.frontendContainerPort" . }}
            {{- toYaml (omit .Values.frontend.readinessProbe "httpGet") | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- if eq (include "openan.frontendType" .) "workflow-designer" }}
          volumeMounts:
            - name: nginx-conf-rendered
              mountPath: /etc/nginx/conf.d
          {{- end }}
          {{- if eq (include "openan.frontendType" .) "portal" }}
          volumeMounts:
            - name: portal-html
              mountPath: /usr/share/nginx/html
          {{- end }}
      {{- if eq (include "openan.frontendType" .) "workflow-designer" }}
      volumes:
        - name: nginx-conf-rendered
          emptyDir: {}
        - name: nginx-config-cm
          configMap:
            name: openan-frontend-nginx-config
      {{- end }}
      {{- if eq (include "openan.frontendType" .) "portal" }}
      volumes:
        - name: portal-html
          emptyDir: {}
      {{- end }}
{{- end }}
