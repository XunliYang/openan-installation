{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: openan-mysql
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.mysql.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "openan.mysql.selectorLabels" . | nindent 4 }}
  ports:
  - port: {{ .Values.mysql.port }}
    targetPort: {{ .Values.mysql.port }}
    protocol: TCP
    name: mysql

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openan-mysql
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.mysql.labels" . | nindent 4 }}
spec:
  serviceName: openan-mysql
  replicas: 1
  selector:
    matchLabels:
      {{- include "openan.mysql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openan.mysql.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: mysql
        image: "{{ .Values.mysql.image | default "mysql:8.4.3" }}"
        imagePullPolicy: {{ .Values.mysql.imagePullPolicy | default "IfNotPresent" }}
        ports:
        - containerPort: {{ .Values.mysql.port }}
        args:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        env:
        - name: MYSQL_ROOT_PASSWORD
          {{- if .Values.mysql.existingSecret }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.mysql.existingSecret }}
              key: mysql-root-password
          {{- else }}
          value: {{ .Values.mysql.password | quote }}
          {{- end }}
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - mysqladmin ping -h 127.0.0.1 -uroot -p"${MYSQL_ROOT_PASSWORD}"
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - mysqladmin ping -h 127.0.0.1 -uroot -p"${MYSQL_ROOT_PASSWORD}"
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          {{- toYaml .Values.mysql.resources | nindent 10 }}
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: init-script
        configMap:
          name: openan-mysql-init
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.mysql.storage.size }}
      {{- if .Values.mysql.storage.storageClassName }}
      storageClassName: {{ .Values.mysql.storage.storageClassName }}
      {{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openan-mysql-init
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.mysql.labels" . | nindent 4 }}
data:
  create-databases.sh: |
    #!/bin/bash
    set -e
    {{ range .Values.mysql.databases }}
    mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" <<EOSQL
    CREATE DATABASE IF NOT EXISTS {{ .name }} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE USER IF NOT EXISTS '{{ .user }}'@'%' IDENTIFIED BY '${MYSQL_ROOT_PASSWORD}';
    GRANT ALL PRIVILEGES ON {{ .name }}.* TO '{{ .user }}'@'%';
    EOSQL
    {{ end }}
    mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" -e "FLUSH PRIVILEGES;"
{{- end }}
