{{- if .Values.orchestration.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestration-center-models
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.orchestration.labels" . | nindent 4 }}
data:
  models.yaml: |
    # Generated from chart values; secrets are referenced by env var, never inlined.
    models:
      chat:
        provider: openai_compatible
        model: {{ .Values.orchestration.llm.chat.model }}
        url: {{ .Values.orchestration.llm.chat.url }}
        api_key_env: LLM_CHAT_API_KEY
{{- end }}
