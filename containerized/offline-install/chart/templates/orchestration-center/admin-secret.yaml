{{- if and .Values.orchestration.enabled .Values.orchestration.admin.initialPassword (not .Values.orchestration.admin.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: orchestration-center-admin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.orchestration.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ .Values.orchestration.admin.initialPassword | quote }}
{{- end }}
