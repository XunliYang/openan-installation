{{- if .Values.orchestration.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: orchestration-center-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.orchestration.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (ne (include "openan.dbType" .) "mysql") (not .Values.postgresql.existingSecret) }}
  db-password: {{ .Values.postgresql.password | quote }}
  {{- end }}
  {{- if and (eq (include "openan.dbType" .) "mysql") (not .Values.mysql.existingSecret) }}
  db-password: {{ .Values.mysql.password | quote }}
  {{- end }}
  {{- if .Values.orchestration.llm.chat.apiKey }}
  llm-chat-api-key: {{ .Values.orchestration.llm.chat.apiKey | quote }}
  {{- end }}
  {{- if .Values.orchestration.llm.embed.apiKey }}
  llm-embed-api-key: {{ .Values.orchestration.llm.embed.apiKey | quote }}
  {{- end }}
  {{- if .Values.orchestration.llm.rerank.apiKey }}
  llm-rerank-api-key: {{ .Values.orchestration.llm.rerank.apiKey | quote }}
  {{- end }}
{{- end }}
