{{- if .Values.orchestration.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestration-center
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.orchestration.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.orchestration.replicas }}
  selector:
    matchLabels:
      {{- include "openan.orchestration.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openan.orchestration.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 120
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  {{- include "openan.orchestration.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      initContainers:
        # The image ships only etc/conf/db_config.json.template while the
        # entrypoint edits etc/conf/db_config.json in place. Copy the whole
        # etc tree onto a writable emptyDir so the entrypoint can write.
        - name: seed-etc
          image: "{{ .Values.orchestration.image.repository }}:{{ .Values.orchestration.image.tag }}"
          imagePullPolicy: {{ .Values.orchestration.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cp -r --no-preserve=timestamps,ownership /opt/orchestration-center/etc/. /seeded/ 2>/dev/null || \
                cp -r /opt/orchestration-center/etc/. /seeded/
              if [ ! -f /seeded/conf/db_config.json ] && [ -f /seeded/conf/db_config.json.template ]; then
                cp /seeded/conf/db_config.json.template /seeded/conf/db_config.json
              fi
              ls -la /seeded/conf/
          volumeMounts:
            - name: etc-dir
              mountPath: /seeded
      containers:
      - name: orchestration-center
        image: "{{ .Values.orchestration.image.repository }}:{{ .Values.orchestration.image.tag }}"
        imagePullPolicy: {{ .Values.orchestration.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.orchestration.port }}
        envFrom:
        - configMapRef:
            name: orchestration-center-config
        env:
        - name: DB_PASSWORD
          {{- if and (ne (include "openan.dbType" .) "mysql") .Values.postgresql.existingSecret }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.existingSecret }}
              key: postgres-password
          {{- else if and (eq (include "openan.dbType" .) "mysql") .Values.mysql.existingSecret }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.mysql.existingSecret }}
              key: mysql-root-password
          {{- else }}
          valueFrom:
            secretKeyRef:
              name: orchestration-center-secret
              key: db-password
          {{- end }}
        {{- if or .Values.orchestration.admin.existingSecret .Values.orchestration.admin.initialPassword }}
        - name: OC_ADMIN_INITIAL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.orchestration.admin.existingSecret | default "orchestration-center-admin" }}
              key: admin-password
        {{- end }}
        - name: LLM_CONFIG_FILE
          value: /opt/orchestration-center/etc/config/models.yaml
        {{- if .Values.orchestration.llm.chat.apiKey }}
        - name: LLM_CHAT_API_KEY
          valueFrom:
            secretKeyRef:
              name: orchestration-center-secret
              key: llm-chat-api-key
        {{- else if .Values.orchestration.llm.chat.existingSecret }}
        - name: LLM_CHAT_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.orchestration.llm.chat.existingSecret }}
              key: {{ .Values.orchestration.llm.chat.existingSecretKey }}
        {{- end }}
        {{- if .Values.orchestration.llm.embed.apiKey }}
        - name: LLM_EMBED_API_KEY
          valueFrom:
            secretKeyRef:
              name: orchestration-center-secret
              key: llm-embed-api-key
        {{- else if .Values.orchestration.llm.embed.existingSecret }}
        - name: LLM_EMBED_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.orchestration.llm.embed.existingSecret }}
              key: {{ .Values.orchestration.llm.embed.existingSecretKey }}
        {{- end }}
        {{- if .Values.orchestration.llm.rerank.apiKey }}
        - name: LLM_RERANK_API_KEY
          valueFrom:
            secretKeyRef:
              name: orchestration-center-secret
              key: llm-rerank-api-key
        {{- else if .Values.orchestration.llm.rerank.existingSecret }}
        - name: LLM_RERANK_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.orchestration.llm.rerank.existingSecret }}
              key: {{ .Values.orchestration.llm.rerank.existingSecretKey }}
        {{- end }}
        startupProbe:
          {{- toYaml .Values.orchestration.startupProbe | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.orchestration.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.orchestration.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.orchestration.resources | nindent 10 }}
        volumeMounts:
        - name: etc-dir
          mountPath: /opt/orchestration-center/etc
        - name: models-config
          mountPath: /opt/orchestration-center/etc/config/models.yaml
          subPath: models.yaml
          readOnly: true
        {{- if and .Values.https.enabled (ne .Values.orchestration.tls.mode "off") }}
        - name: tls-certs
          mountPath: /opt/orchestration-center/etc/ssl
          readOnly: true
        {{- end }}
        {{- if and .Values.https.enabled .Values.orchestration.registryClientSecret }}
        - name: registry-tls
          mountPath: /opt/orchestration-center/etc/registry_tls/trust.cer
          subPath: trust.cer
          readOnly: true
        {{- if .Values.https.verifyClient }}
        - name: registry-tls
          mountPath: /opt/orchestration-center/etc/registry_tls/client.cer
          subPath: client.cer
          readOnly: true
        - name: registry-tls
          mountPath: /opt/orchestration-center/etc/registry_tls/client_key.pem
          subPath: client_key.pem
          readOnly: true
        {{- end }}
        {{- end }}
      volumes:
      - name: etc-dir
        emptyDir: {}
      - name: models-config
        configMap:
          name: orchestration-center-models
      {{- if and .Values.https.enabled (ne .Values.orchestration.tls.mode "off") }}
      - name: tls-certs
        secret:
          {{- if eq .Values.orchestration.tls.mode "auto" }}
          secretName: orchestration-center-tls
          {{- else }}
          secretName: {{ .Values.orchestration.tls.existingSecret }}
          {{- end }}
      {{- end }}
      {{- if and .Values.https.enabled .Values.orchestration.registryClientSecret }}
      - name: registry-tls
        secret:
          secretName: {{ .Values.orchestration.registryClientSecret }}
      {{- end }}
{{- end }}
