{{- if .Values.orchestration.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestration-center-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.orchestration.labels" . | nindent 4 }}
data:
  RETRIEVAL_VECTOR_ENABLED: {{ .Values.orchestration.retrieval.vector.enabled | quote }}
  RETRIEVAL_VECTOR_TOP_K: {{ .Values.orchestration.retrieval.vector.topK | quote }}
  RETRIEVAL_VECTOR_MIN_SCORE: {{ .Values.orchestration.retrieval.vector.minScore | quote }}
  RETRIEVAL_VECTOR_RERANK: {{ .Values.orchestration.retrieval.vector.rerank | quote }}
  RETRIEVAL_VECTOR_LLM_FINAL: {{ .Values.orchestration.retrieval.vector.llmFinal | quote }}
  RETRIEVAL_VECTOR_STRICT: {{ .Values.orchestration.retrieval.vector.strict | quote }}
  RETRIEVAL_VECTOR_INDEX_FILE: {{ .Values.orchestration.retrieval.vector.indexFile | quote }}
  RETRIEVAL_LLM_THINKING: {{ .Values.orchestration.retrieval.llm.thinking | quote }}
  # db_config.json — the image only ships db_config.json.template and the
  # entrypoint expects the rendered file to exist; provide it via ConfigMap.
  db_config.json: |
    {
      "host": "{{ include "openan.dbHost" . }}",
      "port": "{{ include "openan.dbPort" . }}",
      "database": "orchestration_center",
      "user": "opena2a_t",
      "password": ""
    }
  # Server
  ORCH_IP: "0.0.0.0"
  ORCH_PORT: {{ .Values.orchestration.port | quote }}
  ORCH_ENABLE_HTTPS: {{ .Values.https.enabled | quote }}
  ORCH_FORWARDED_ALLOW_IPS: "*"

  # Persistence
  PERSISTENCE_MODE: {{ include "openan.dbType" . | quote }}

  # Database
  DB_HOST: {{ include "openan.dbHost" . | quote }}
  DB_PORT: {{ include "openan.dbPort" . | quote }}
  DB_NAME: "orchestration_center"
  DB_USERNAME: "opena2a_t"

  # Agent Registry
  AGENT_REGISTRY_URL: {{ include "openan.registryUrl" . | quote }}
  # OC->RC outbound TLS verification (material in registryClientSecret)
  ORCH_CLIENT_VERIFY_SERVER: {{ .Values.orchestration.clientVerifyServer | quote }}
  {{- if and .Values.https.enabled .Values.orchestration.registryClientSecret .Values.orchestration.clientVerifyServer }}
  REGISTRY_CA_FILE: "/opt/orchestration-center/etc/registry_tls/trust.cer"
  {{- end }}
  {{- if and .Values.https.enabled .Values.orchestration.registryClientSecret .Values.https.verifyClient }}
  REGISTRY_CLIENT_CERT: "/opt/orchestration-center/etc/registry_tls/client.cer"
  REGISTRY_CLIENT_KEY: "/opt/orchestration-center/etc/registry_tls/client_key.pem"
  {{- end }}

  # LLM Chat
  LLM_CHAT_MODEL: {{ .Values.orchestration.llm.chat.model | quote }}
  LLM_CHAT_URL: {{ .Values.orchestration.llm.chat.url | quote }}

  # LLM Embed (workflow semantic retrieval)
  LLM_EMBED_MODEL: {{ .Values.orchestration.llm.embed.model | quote }}
  LLM_EMBED_URL: {{ .Values.orchestration.llm.embed.url | quote }}

  # LLM Rerank (optional, top-N retrieval)
  LLM_RERANK_MODEL: {{ .Values.orchestration.llm.rerank.model | quote }}
  LLM_RERANK_URL: {{ .Values.orchestration.llm.rerank.url | quote }}
{{- end }}
