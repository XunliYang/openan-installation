#
# Auto-generated TLS certificate for orchestration-center.
# Only rendered when HTTPS is enabled and orchestration.tls.mode=auto.
# On upgrade: preserves existing certificate (via lookup).
# To use custom certificate: set orchestration.tls.mode=secret.

{{ if and .Values.orchestration.enabled .Values.https.enabled (eq .Values.orchestration.tls.mode "auto") }}
{{ $existingTls := lookup "v1" "Secret" .Values.namespace "orchestration-center-tls" }}
{{ if $existingTls }}
# Reuse existing TLS certificate to preserve compatibility
apiVersion: v1
kind: Secret
metadata:
  name: orchestration-center-tls
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.orchestration.labels" . | nindent 4 }}
type: Opaque
data:
  server.cer: {{ index $existingTls.data "server.cer" }}
  server_key.pem: {{ index $existingTls.data "server_key.pem" }}
  trust.cer: {{ index $existingTls.data "trust.cer" }}
  cert_pwd: {{ index $existingTls.data "cert_pwd" }}
{{ else }}
{{ $ca := genCA "OpenAN CA" 3650 }}
{{ $tlsCert := genSignedCert "orchestration-center" nil (list "orchestration-center" (printf "orchestration-center.%s.svc.cluster.local" .Values.namespace)) 3650 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: orchestration-center-tls
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.orchestration.labels" . | nindent 4 }}
type: Opaque
data:
  server.cer: {{ $tlsCert.Cert | b64enc }}
  server_key.pem: {{ $tlsCert.Key | b64enc }}
  trust.cer: {{ $ca.Cert | b64enc }}
  cert_pwd: {{ "" | b64enc }}
{{ end }}
{{ end }}
