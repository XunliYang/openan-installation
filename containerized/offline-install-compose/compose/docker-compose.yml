# OpenAN offline single-host deployment (Docker Compose).
# Two registry-center and two orchestration-center containers, one nginx entry.
# Images are loaded locally with `docker load`; no registry is used.

name: openan

x-registry-center: &registry-center
  image: "${REGISTRY_CENTER_IMAGE}"
  restart: unless-stopped
  environment: &registry-env
    REGISTRY_IP: "0.0.0.0"
    REGISTRY_PORT: "5000"
    REGISTRY_ENABLE_HTTPS: "false"
    REGISTRY_FORWARDED_ALLOW_IPS: "*"
    REGISTRY_OWNER__VALIDATION__MODE: "relaxed"
    PERSISTENCE_MODE: "postgresql"
    DB_HOST: "openan-postgres"
    DB_PORT: "5432"
    DB_NAME: "registry_center"
    DB_USERNAME: "registry"
    DB_PASSWORD: "${DB_PASSWORD}"
    DB_POOL_MIN: "2"
    DB_POOL_MAX: "10"
    LLM_CHAT_MODEL: "${REGISTRY_CHAT_MODEL}"
    LLM_CHAT_URL: "${REGISTRY_CHAT_URL}"
    LLM_CHAT_API_KEY: "${REGISTRY_CHAT_APIKEY}"
    USE_VECTORDB: "false"
  depends_on:
    openan-postgres:
      condition: service_healthy
  networks: [openan]

x-orchestration-center: &orchestration-center
  image: "${ORCHESTRATION_CENTER_IMAGE}"
  restart: unless-stopped
  environment: &orchestration-env
    ORCH_IP: "0.0.0.0"
    ORCH_PORT: "5001"
    ORCH_ENABLE_HTTPS: "false"
    ORCH_FORWARDED_ALLOW_IPS: "*"
    PERSISTENCE_MODE: "postgresql"
    DB_HOST: "openan-postgres"
    DB_PORT: "5432"
    DB_NAME: "orchestration_center"
    DB_USERNAME: "opena2a_t"
    DB_PASSWORD: "${DB_PASSWORD}"
    AGENT_REGISTRY_URL: "http://openan-nginx:5000"
    LLM_CHAT_MODEL: "${ORCH_CHAT_MODEL}"
    LLM_CHAT_URL: "${ORCH_CHAT_URL}"
    LLM_CHAT_API_KEY: "${ORCH_CHAT_APIKEY}"
  depends_on:
    openan-postgres:
      condition: service_healthy
  networks: [openan]

services:
  openan-postgres:
    image: "postgres:15-alpine"
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - "./data/postgres:/var/lib/postgresql/data"
      - "./init/create-databases.sh:/docker-entrypoint-initdb.d/create-databases.sh:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [openan]

  registry-center-1:
    <<: *registry-center
  registry-center-2:
    <<: *registry-center

  orchestration-center-1:
    <<: *orchestration-center
  orchestration-center-2:
    <<: *orchestration-center

  openan-nginx:
    image: "nginx:1.25-alpine"
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
      - "../web:/usr/share/nginx/html:ro"
    depends_on:
      - registry-center-1
      - registry-center-2
      - orchestration-center-1
      - orchestration-center-2
    networks: [openan]

networks:
  openan:
    driver: bridge
