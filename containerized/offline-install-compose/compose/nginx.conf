# nginx entry point for the OpenAN offline single-host deployment.
#   :80   public entry  -> static frontend + /registry + /api/orchestrate
#   :5000 internal      -> pass-through to registry-center (for orchestration)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;

    upstream openan_registry {
        server registry-center-1:5000 max_fails=3 fail_timeout=10s;
        server registry-center-2:5000 max_fails=3 fail_timeout=10s;
    }

    upstream openan_orchestration {
        # Session affinity: orchestration-center keeps login sessions in each
        # replica's process memory (single-process token store), so a session
        # minted by one replica is invisible to the other. Without sticky routing,
        # requests round-robin across the two replicas and non-login API calls
        # intermittently return 401, bouncing the frontend back to the login page.
        # Pin each client to a single replica with ip_hash to keep a session on
        # the replica that minted it.
        ip_hash;
        server orchestration-center-1:5001 max_fails=3 fail_timeout=10s;
        server orchestration-center-2:5001 max_fails=3 fail_timeout=10s;
    }

    # ---------------------------------------------------------------------
    # Public entry point
    # ---------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Registry API  (/registry/rest/v1/... -> /rest/v1/...)
        location ~ ^/registry(/|$)(.*)$ {
            rewrite ^/registry(/|$)(.*)$ /$2 break;
            proxy_pass http://openan_registry;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # Orchestration API  (/api/orchestrate/rest/v1/... -> /rest/v1/...)
        location ~ ^/api/orchestrate(/|$)(.*)$ {
            rewrite ^/api/orchestrate(/|$)(.*)$ /$2 break;
            proxy_pass http://openan_orchestration;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # Orchestration API (direct)
        location /rest/v1/orchestrate/ {
            proxy_pass http://openan_orchestration;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ---------------------------------------------------------------------
    # Internal registry endpoint (AGENT_REGISTRY_URL=http://openan-nginx:5000)
    # ---------------------------------------------------------------------
    server {
        listen 5000;
        server_name _;

        location / {
            proxy_pass http://openan_registry;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }
    }
}
