# Evaluation defaults: in-cluster PostgreSQL, HTTP, portal frontend.
# Fill in secrets via Secrets (see configure.py or create manually), then:
#   helm install openan ./openan-chart -n openan --create-namespace -f example.values.yaml
#
# Production: copy this file, switch to external SQL, enable TLS, and
# reference pre-created Secrets. See docs/online-install-architecture.md for details.

namespace: openan

# In-cluster PostgreSQL (evaluation default)
postgresql:
  enabled: true
  # Use postgresql.existingSecret for production (key: postgres-password)
  existingSecret: openan-pg

database:
  type: postgresql

# Registry Center
registry:
  enabled: true
  image:
    tag: v1.0.0  # REQUIRED: no default; see deployment contract
  runtimeSecret: openan-rc-runtime
  credentialSecret: openan-rc-credentials
  modelsConfigMap: openan-rc-models
  signing:
    mode: auto  # demo; use "secret" for production
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Orchestration Center
orchestration:
  enabled: true
  image:
    tag: v1.0.0  # REQUIRED: no default; see deployment contract
  runtimeSecret: openan-oc-runtime
  modelsConfigMap: openan-oc-models
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

# Frontend (portal by default)
frontend:
  type: portal  # portal | workflow-designer
  enabled: true
  image:
    tag: v1.0.0  # REQUIRED: no default; see deployment contract
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

# Ingress
ingress:
  enabled: true
  className: nginx
  host: ""  # empty = IP-based access; set a DNS name for host-based routing
  tls:
    enabled: false  # evaluation; enable for HTTPS
    secretName: openan-tls
