{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-designer
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "openan.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/workflow-designer/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "openan.frontend.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: workflow-designer
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.frontend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.frontend.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            {{- if .Values.frontend.backendTls.existingSecret }}
            - name: backend-tls
              mountPath: /etc/nginx/backend-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: workflow-designer-nginx-config
        {{- if .Values.frontend.backendTls.existingSecret }}
        - name: backend-tls
          secret:
            secretName: {{ .Values.frontend.backendTls.existingSecret }}
            defaultMode: 0400
        {{- end }}
{{- end }}
