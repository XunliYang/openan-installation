{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-designer-nginx-config
  namespace: {{ .Values.namespace }}
data:
  default.conf: |
    {{- if .Values.frontend.nginxConfig }}
    {{- tpl .Values.frontend.nginxConfig . | nindent 4 }}
    {{- else }}
    server {
        listen {{ .Values.frontend.port }};
        root /usr/share/nginx/html;
        index index.html;
        gzip on;
        gzip_vary on;
        gzip_types text/css application/javascript image/svg+xml;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        {{- range $location := list "/api/orchestrate/" "/rest/v1/orchestrate/" }}
        location {{ $location }} {
            proxy_pass {{ ternary "https" "http" $.Values.orchestration.tls.enabled }}://orchestration-center:{{ $.Values.orchestration.port }}{{ if eq $location "/api/orchestrate/" }}/{{ end }};
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto {{ include "openan.publicScheme" $ }};
            proxy_set_header X-OpenAN-Browser-Gateway "1";
            gzip off; # Do not compress authenticated APIs/SSE.
            proxy_buffering off;
            proxy_read_timeout 300s;
            {{- if $.Values.orchestration.tls.enabled }}
            proxy_ssl_server_name on;
            proxy_ssl_name orchestration-center;
            proxy_ssl_verify {{ ternary "on" "off" $.Values.frontend.backendTls.verifyServer }};
            {{- if $.Values.frontend.backendTls.verifyServer }}
            proxy_ssl_trusted_certificate /etc/nginx/backend-tls/trust.cer;
            {{- end }}
            {{- if $.Values.orchestration.tls.verifyClient }}
            proxy_ssl_certificate /etc/nginx/backend-tls/client.cer;
            proxy_ssl_certificate_key /etc/nginx/backend-tls/client_key.pem;
            {{- end }}
            {{- end }}
        }
        {{- end }}
        # Vite content-hashed assets only; never apply this cache to APIs or index.html.
        location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\\.(js|css|svg|png|jpg|woff2)$" {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
        }
        location = /index.html {
            add_header Cache-Control "no-store";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
        }
        # X-XSS-Protection intentionally omitted: deprecated browser filter, not a modern defense.
        location / { try_files $uri $uri/ /index.html; }
    }
    {{- end }}
{{- end }}
