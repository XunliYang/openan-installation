{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-designer-nginx-config
  namespace: {{ .Values.namespace }}
data:
  default.conf: |
    {{- if .Values.frontend.nginxConfig }}
    {{- tpl .Values.frontend.nginxConfig . | nindent 4 }}
    {{- else }}
    server {
        listen {{ .Values.frontend.port }};
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        {{- range $location := list "/api/orchestrate/" "/rest/v1/orchestrate/" }}
        location {{ $location }} {
            proxy_pass {{ ternary "https" "http" $.Values.orchestration.tls.enabled }}://orchestration-center:{{ $.Values.orchestration.port }}{{ if eq $location "/api/orchestrate/" }}/{{ end }};
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto {{ include "openan.publicScheme" $ }};
            proxy_buffering off;
            proxy_read_timeout 300s;
            {{- if $.Values.orchestration.tls.enabled }}
            proxy_ssl_server_name on;
            proxy_ssl_name orchestration-center;
            proxy_ssl_verify {{ ternary "on" "off" $.Values.frontend.backendTls.verifyServer }};
            {{- if $.Values.frontend.backendTls.verifyServer }}
            proxy_ssl_trusted_certificate /etc/nginx/backend-tls/trust.cer;
            {{- end }}
            {{- if $.Values.orchestration.tls.verifyClient }}
            proxy_ssl_certificate /etc/nginx/backend-tls/client.cer;
            proxy_ssl_certificate_key /etc/nginx/backend-tls/client_key.pem;
            {{- end }}
            {{- end }}
        }
        {{- end }}
        location / { try_files $uri $uri/ /index.html; }
    }
    {{- end }}
{{- end }}
