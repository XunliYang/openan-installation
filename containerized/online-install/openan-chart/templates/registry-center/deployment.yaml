{{- if .Values.registry.enabled }}
{{- $c := .Values.registry }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-center
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.registry.labels" . | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      app: registry-center
  template:
    metadata:
      labels:
        app: registry-center
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/registry-center/configmap.yaml") . | sha256sum }}
        checksum/models: {{ include (print $.Template.BasePath "/registry-center/models.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: registry-center
        image: "{{ $c.image.repository }}:{{ $c.image.tag }}"
        imagePullPolicy: {{ $c.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: {{ $c.port }}
        envFrom:
        - configMapRef:
            name: registry-center-config
        - secretRef:
            name: {{ $c.runtimeSecret }}
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              {{- if (index .Values.database "registry").existingSecret }}
              name: {{ (index .Values.database "registry").existingSecret }}
              key: {{ (index .Values.database "registry").passwordKey }}
              {{- else if .Values.postgresql.existingSecret }}
              name: {{ .Values.postgresql.existingSecret }}
              key: postgres-password
              {{- else }}
              name: registry-center-secret
              key: db-password
              {{- end }}
        {{- range $cap, $model := $c.llm }}
        {{- if or $model.existingSecret $model.apiKey }}
        - name: LLM_{{ upper $cap }}_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ default "registry-center-secret" $model.existingSecret }}
              key: {{ ternary $model.existingSecretKey (printf "llm-%s-api-key" $cap) (not (empty $model.existingSecret)) }}
        {{- end }}
        {{- end }}

        livenessProbe:
          {{- toYaml $c.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml $c.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml $c.resources | nindent 10 }}
        volumeMounts:
        - name: models
          mountPath: /opt/registry-center/etc/config/models.yaml
          subPath: models.yaml
          readOnly: true
        {{- if $c.tls.enabled }}
        {{- $keys := list "server.cer" "server_key.pem" "cert_pwd" "trust.cer" }}
        {{- if $c.tls.verifyClient }}{{ $keys = concat $keys (list "probe-client.cer" "probe-client.key") }}{{ end }}
        {{- range $key := $keys }}
        - name: tls
          mountPath: /opt/registry-center/etc/ssl/{{ $key }}
          subPath: {{ $key }}
          readOnly: true
        {{- end }}
        {{- end }}
        {{- if ne $c.signing.mode "off" }}
        {{- range $key := list "sign.cer" "sign_key.pem" "cert_pwd" }}
        - name: signing
          mountPath: /opt/registry-center/etc/sign_cert/{{ $key }}
          subPath: {{ $key }}
          readOnly: true
        {{- end }}
        {{- end }}
        {{- if $c.credentialSecret }}
        - name: credentials
          mountPath: /opt/registry-center/etc/conf/integration_credentials.conf
          subPath: integration_credentials.conf
          readOnly: true
        {{- end }}
      volumes:
      - name: models
        configMap:
          name: {{ default "registry-center-models" $c.modelsConfigMap }}
      {{- if $c.tls.enabled }}
      - name: tls
        secret:
          secretName: {{ $c.tls.existingSecret }}
          defaultMode: 0440
      {{- end }}
      {{- if ne $c.signing.mode "off" }}
      - name: signing
        secret:
          secretName: {{ ternary "registry-center-signing" $c.signing.existingSecret (eq $c.signing.mode "auto") }}
          defaultMode: 0440
      {{- end }}
      {{- if $c.credentialSecret }}
      - name: credentials
        secret:
          secretName: {{ $c.credentialSecret }}
          defaultMode: 0440
      {{- end }}
{{- end }}
