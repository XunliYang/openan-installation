{{- if and .Values.registry.enabled (not .Values.registry.modelsConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-center-models
  namespace: {{ .Values.namespace }}
data:
  models.yaml: |
    models:
      {{- range $cap, $model := .Values.registry.llm }}
      {{- if $model.model }}
      {{ $cap }}:
        provider: {{ default "openai_compatible" $model.provider | quote }}
        model: {{ $model.model | quote }}
        url: {{ $model.url | quote }}
        api_key_env: LLM_{{ upper $cap }}_API_KEY
        timeout: {{ default 60 $model.timeout }}
        verify_ssl: {{ if hasKey $model "verifySsl" }}{{ $model.verifySsl }}{{ else }}true{{ end }}
      {{- end }}
      {{- end }}
{{- end }}
