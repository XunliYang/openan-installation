{{/* Signing supports empty password for a plain key; TLS has a different contract. */}}
{{- if and .Values.registry.enabled (eq .Values.registry.signing.mode "auto") }}
{{- $existing := lookup "v1" "Secret" .Values.namespace "registry-center-signing" }}
{{- $cert := "" }}
{{- $key := "" }}
{{- $password := "" }}
{{- if $existing }}
{{- $cert = default (index $existing.data "server.cer") (index $existing.data "sign.cer") }}
{{- $key = default (index $existing.data "server_key.pem") (index $existing.data "sign_key.pem") }}
{{- $password = default "" (index $existing.data "cert_pwd") }}
{{- if or (not $cert) (not $key) }}{{ fail "Existing signing Secret is incomplete; refusing automatic key rotation" }}{{ end }}
{{- else }}
{{- $ca := genCA "OpenAN Signing CA" 3650 }}
{{- $pair := genSignedCert "registry-center-signing" nil nil 3650 $ca }}
{{- $cert = $pair.Cert | b64enc }}
{{- $key = $pair.Key | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: registry-center-signing
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  sign.cer: {{ $cert | quote }}
  sign_key.pem: {{ $key | quote }}
  cert_pwd: {{ $password | quote }}
{{- end }}
