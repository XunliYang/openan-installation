{{- if .Values.registry.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-center-config
  namespace: {{ .Values.namespace }}
data:
  REGISTRY_IP: "0.0.0.0"
  REGISTRY_PORT: {{ .Values.registry.port | quote }}
  REGISTRY_ENABLE_HTTPS: {{ .Values.registry.tls.enabled | quote }}
  REGISTRY_VERIFY_CLIENT: {{ .Values.registry.tls.verifyClient | quote }}
  REGISTRY_FORWARDED_ALLOW_IPS: "127.0.0.1"
  REGISTRY_STARTUP_STRICT_IDENTITY: "true"
  REGISTRY_OWNER_IDENTITY_MODE: {{ .Values.registry.identityMode | quote }}
  REGISTRY_INTEGRATION_AUTH_MODE: {{ .Values.registry.authMode | quote }}
  REGISTRY_REGISTRY_PUBLIC_BASE_URL: {{ .Values.registry.publicBaseUrl | quote }}
  REGISTRY_REGISTRY_SIGN_ENABLED: {{ ne .Values.registry.signing.mode "off" | quote }}
  PERSISTENCE_MODE: {{ .Values.database.type | quote }}
  DB_HOST: {{ include "openan.databaseHost" . | quote }}
  DB_PORT: {{ include "openan.databasePort" . | quote }}
  DB_NAME: {{ .Values.database.registry.name | quote }}
  DB_USERNAME: {{ .Values.database.registry.username | quote }}
  REGISTRY_USE_VECTORDB: {{ .Values.registry.vectordb.enabled | quote }}
  {{- if .Values.registry.vectordb.enabled }}
  MILVUS_URI: {{ printf "http://%s:%v" .Values.registry.vectordb.host .Values.registry.vectordb.port | quote }}
  {{- end }}
  LLM_CONFIG_FILE: "/opt/registry-center/etc/config/models.yaml"
  {{- if .Values.registry.tls.verifyClient }}
  REGISTRY_HEALTHCHECK_CLIENT_CERT: "/opt/registry-center/etc/ssl/probe-client.cer"
  REGISTRY_HEALTHCHECK_CLIENT_KEY: "/opt/registry-center/etc/ssl/probe-client.key"
  {{- end }}
  {{- range $key, $value := .Values.registry.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
