{{- if .Values.registry.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: registry-center-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.registry.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.postgresql.existingSecret }}
  db-password: {{ .Values.postgresql.password | quote }}
  {{- end }}
  {{- range $cap, $model := .Values.registry.llm }}
  {{- if and $model.apiKey (not $model.existingSecret) }}
  llm-{{ $cap }}-api-key: {{ $model.apiKey | quote }}
  {{- end }}
  {{- end }}
{{- end }}
