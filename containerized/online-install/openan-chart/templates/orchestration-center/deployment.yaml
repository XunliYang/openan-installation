{{- if .Values.orchestration.enabled }}
{{- $c := .Values.orchestration }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestration-center
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.orchestration.labels" . | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      app: orchestration-center
  template:
    metadata:
      labels:
        app: orchestration-center
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/orchestration-center/configmap.yaml") . | sha256sum }}
        checksum/models: {{ include (print $.Template.BasePath "/orchestration-center/models.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: orchestration-center
        image: "{{ $c.image.repository }}:{{ $c.image.tag }}"
        imagePullPolicy: {{ $c.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: {{ $c.port }}
        envFrom:
        - configMapRef:
            name: orchestration-center-config
        - secretRef:
            name: {{ $c.runtimeSecret }}
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              {{- if (index .Values.database "orchestration").existingSecret }}
              name: {{ (index .Values.database "orchestration").existingSecret }}
              key: {{ (index .Values.database "orchestration").passwordKey }}
              {{- else if .Values.postgresql.existingSecret }}
              name: {{ .Values.postgresql.existingSecret }}
              key: postgres-password
              {{- else }}
              name: orchestration-center-secret
              key: db-password
              {{- end }}
        {{- range $cap, $model := $c.llm }}
        {{- if or $model.existingSecret $model.apiKey }}
        - name: LLM_{{ upper $cap }}_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ default "orchestration-center-secret" $model.existingSecret }}
              key: {{ ternary $model.existingSecretKey (printf "llm-%s-api-key" $cap) (not (empty $model.existingSecret)) }}
        {{- end }}
        {{- end }}
        startupProbe:
          {{- toYaml $c.startupProbe | nindent 10 }}
        livenessProbe:
          {{- toYaml $c.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml $c.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml $c.resources | nindent 10 }}
        volumeMounts:
        - name: models
          mountPath: /opt/orchestration-center/etc/config/models.yaml
          subPath: models.yaml
          readOnly: true
        {{- if $c.tls.enabled }}
        {{- $keys := list "server.cer" "server_key.pem" "cert_pwd" "trust.cer" }}
        {{- if $c.tls.verifyClient }}{{ $keys = concat $keys (list "probe-client.cer" "probe-client.key") }}{{ end }}
        {{- range $key := $keys }}
        - name: tls
          mountPath: /opt/orchestration-center/etc/ssl/{{ $key }}
          subPath: {{ $key }}
          readOnly: true
        {{- end }}
        {{- end }}
        {{- if $c.registryClientSecret }}
        - name: registry-client
          mountPath: /opt/orchestration-center/etc/registry_tls
          readOnly: true
        {{- end }}
      volumes:
      - name: models
        configMap:
          name: {{ default "orchestration-center-models" $c.modelsConfigMap }}
      {{- if $c.tls.enabled }}
      - name: tls
        secret:
          secretName: {{ $c.tls.existingSecret }}
          defaultMode: 0440
      {{- end }}
      {{- if $c.registryClientSecret }}
      - name: registry-client
        secret:
          secretName: {{ $c.registryClientSecret }}
          defaultMode: 0440
      {{- end }}
{{- end }}
