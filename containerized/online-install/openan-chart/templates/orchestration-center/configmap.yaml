{{- if .Values.orchestration.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestration-center-config
  namespace: {{ .Values.namespace }}
data:
  ORCH_IP: "0.0.0.0"
  ORCH_PORT: {{ .Values.orchestration.port | quote }}
  ORCH_ENABLE_HTTPS: {{ .Values.orchestration.tls.enabled | quote }}
  ORCH_VERIFY_CLIENT: {{ .Values.orchestration.tls.verifyClient | quote }}
  ORCH_FORWARDED_ALLOW_IPS: "127.0.0.1"
  ORCH_CLIENT_VERIFY_SERVER: {{ .Values.orchestration.clientVerifyServer | quote }}
  ORCH_EXTERNAL_AUTH_MODE: {{ ternary "mtls" "bearer" (and .Values.orchestration.tls.enabled .Values.orchestration.tls.verifyClient) | quote }}
  ORCH_PUBLIC_SCHEME: {{ include "openan.publicScheme" . | quote }}
  AGENT_REGISTRY_URL: {{ include "openan.registryUrl" . | quote }}
  {{- if .Values.orchestration.registryClientSecret }}
  REGISTRY_CA_FILE: "/opt/orchestration-center/etc/registry_tls/trust.cer"
  {{- if .Values.registry.tls.verifyClient }}
  REGISTRY_CLIENT_CERT: "/opt/orchestration-center/etc/registry_tls/client.cer"
  REGISTRY_CLIENT_KEY: "/opt/orchestration-center/etc/registry_tls/client_key.pem"
  {{- end }}
  {{- end }}
  PERSISTENCE_MODE: {{ .Values.database.type | quote }}
  DB_HOST: {{ include "openan.databaseHost" . | quote }}
  DB_PORT: {{ include "openan.databasePort" . | quote }}
  DB_NAME: {{ .Values.database.orchestration.name | quote }}
  DB_USERNAME: {{ .Values.database.orchestration.username | quote }}
  LLM_CONFIG_FILE: "/opt/orchestration-center/etc/config/models.yaml"
  {{- if .Values.orchestration.tls.verifyClient }}
  ORCH_HEALTHCHECK_CLIENT_CERT: "/opt/orchestration-center/etc/ssl/probe-client.cer"
  ORCH_HEALTHCHECK_CLIENT_KEY: "/opt/orchestration-center/etc/ssl/probe-client.key"
  {{- end }}
  {{- range $key, $value := .Values.orchestration.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
