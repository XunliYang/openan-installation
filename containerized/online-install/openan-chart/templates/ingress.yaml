{{- if and .Values.ingress.enabled .Values.frontend.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openan-frontend-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.host }}
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workflow-designer
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
---
# Copyright (c) 2026 Huawei Technologies Co., Ltd.
# All Rights Reserved.
# SPDX-License-Identifier: Apache-2.0

{{- if and .Values.ingress.enabled .Values.orchestration.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openan-orchestration-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openan.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestration
  annotations:
    {{- if .Values.orchestration.tls.enabled }}
    nginx.ingress.kubernetes.io/proxy-ssl-verify: {{ ternary "on" "off" .Values.ingress.backendVerifyServer | quote }}
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "true"
    nginx.ingress.kubernetes.io/proxy-ssl-name: "orchestration-center"
    {{- end }}
    nginx.ingress.kubernetes.io/backend-protocol: {{ ternary "HTTPS" "HTTP" .Values.orchestration.tls.enabled | quote }}
    {{- if and .Values.orchestration.tls.enabled (or .Values.orchestration.tls.verifyClient .Values.ingress.backendVerifyServer) }}
    nginx.ingress.kubernetes.io/proxy-ssl-secret: {{ printf "%s/%s" .Values.namespace (required "orchestration mTLS ingress requires ingressClientSecret (tls.crt,tls.key,ca.crt)" .Values.orchestration.ingressClientSecret) | quote }}
    {{- end }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.host }}
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /api/orchestrate(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: orchestration-center
                port:
                  number: {{ .Values.orchestration.port }}
{{- end }}
---
# Copyright (c) 2026 Huawei Technologies Co., Ltd.
