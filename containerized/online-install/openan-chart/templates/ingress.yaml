    nginx.ingress.kubernetes.io/backend-protocol: {{ ternary "HTTPS" "HTTP" .Values.registry.tls.enabled | quote }}
    {{- if and .Values.registry.tls.enabled (or .Values.registry.tls.verifyClient .Values.ingress.backendVerifyServer) }}
    nginx.ingress.kubernetes.io/proxy-ssl-secret: {{ printf "%s/%s" .Values.namespace (required "registry mTLS ingress requires ingressClientSecret (tls.crt,tls.key,ca.crt)" .Values.registry.ingressClientSecret) | quote }}
    {{- end }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    nginx.ingress.kubernetes.io/use-regex: "true"
