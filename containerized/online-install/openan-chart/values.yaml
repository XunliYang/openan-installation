# =============================================================================
# OpenAN Platform Configuration
# =============================================================================

# Global settings
namespace: openan
# Set to false if namespace already exists or managed externally
createNamespace: true

# =============================================================================
# PostgreSQL Configuration (Shared)
# =============================================================================
postgresql:
  # Set to false to use external database
  enabled: true
  # External database settings (when enabled=false)
  externalHost: ""
  port: 5432
  # Database credentials
  # Use existingSecret to reference an existing K8S secret instead of defining password here
  existingSecret: ""
  password: ""  # Prefer existingSecret; never deploy a shared default password
  # Storage
  storage:
    size: 20Gi
    storageClassName: ""
    createStorageClass: false
    createPV: false
    useHostPath: false
    hostPath: "/data/openan-postgres"
    localPath: "/data/openan-postgres"
    nodeName: ""
    reclaimPolicy: "Retain"
    setDefault: false
    pvName: "openan-postgres-pv"
  # Resource limits
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Database definitions
  databases:
    - name: registry_center
      user: registry
    - name: orchestration_center
      user: opena2a_t

# =============================================================================
# Registry Center Configuration (Required)
# =============================================================================
registry:
  ingressClientSecret: ""  # tls.crt/tls.key/ca.crt for ingress upstream mTLS
  runtimeSecret: ""  # Secret ENV: fingerprint/HMAC or OAuth2 credentials
  credentialSecret: ""  # integration_credentials.conf (static Bearer/mTLS entries)
  identityMode: token  # certificate requires TLS + verifyClient=true
  authMode: static_bearer
  publicBaseUrl: ""
  extraEnv: {}  # Non-secret REGISTRY_* provider policies; secrets belong in runtimeSecret
  modelsConfigMap: ""  # Existing ConfigMap with models.yaml; otherwise llm entries below
  enabled: true
  # Runtime event listeners/dispatchers are not coordinated across replicas.
  replicas: 1
  persistence:
    existingClaim: ""  # Otherwise create registry-center-runtime (retained on uninstall).
    size: 5Gi
    storageClassName: ""  # Empty: default StorageClass; "-": explicitly no class.
  image:
    repository: ghcr.io/project-openan/registry-center
    tag: ""  # REQUIRED: tag/digest-built revision compatible with this chart; see deployment contract.
    pullPolicy: Always
  port: 5000
  # LLM configuration for registry-center
  llm:
    chat:
      model: "your-chat-model"
      url: "https://your-llm-provider.com/v1/chat/completions"
      apiKey: ""
      existingSecret: ""
      existingSecretKey: "registry-llm-chat-api-key"
    embed:
      model: "your-embed-model"
      url: "https://your-llm-provider.com/v1/embeddings"
      apiKey: ""
      existingSecret: ""
      existingSecretKey: "registry-llm-embed-api-key"
    rerank:
      model: "your-rerank-model"
      url: "https://your-llm-provider.com/v1/rerank"
      apiKey: ""
      existingSecret: ""
      existingSecretKey: "registry-llm-rerank-api-key"
  # VectorDB (optional, Milvus)
  vectordb:
    enabled: false
    host: ""
    port: 19530
  # TLS material is supplied explicitly; no empty-password Helm TLS generation.
  tls:
    enabled: false
    verifyClient: false
    mode: secret
    existingSecret: ""  # server.cer, server_key.pem, cert_pwd, trust.cer; see deployment guide
  # Signing is independent of TLS. Auto is for demos; secret is recommended.
  signing:
    mode: auto
    existingSecret: ""  # sign.cer, sign_key.pem, cert_pwd
  # Resource limits
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Probes
  livenessProbe:
    exec:
      command: ["python", "-m", "agent_registry.healthcheck"]
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
  readinessProbe:
    exec:
      command: ["python", "-m", "agent_registry.healthcheck"]
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10

# =============================================================================
# Orchestration Center Configuration (Optional)
# =============================================================================
orchestration:
  ingressClientSecret: ""
  runtimeSecret: ""  # ENV: OC_ADMIN_INITIAL_PASSWORD, REGISTRY_ACCESS_TOKEN, model secrets
  extraEnv: {}  # Non-secret ORCH_* settings
  publicScheme: ""  # Derived from ingress TLS unless explicitly http/https
  clientVerifyServer: true
  registryClientSecret: ""  # Optional trust.cer, client.cer, client_key.pem
  modelsConfigMap: ""
  tls:
    enabled: false
    verifyClient: false
    mode: secret
    existingSecret: ""
  # Set to false to skip orchestration-center deployment
  enabled: true
  replicas: 1
  persistence:
    existingClaim: ""  # Otherwise create orchestration-center-runtime (retained).
    size: 10Gi
    storageClassName: ""
  image:
    repository: ghcr.io/project-openan/orchestration-center
    tag: ""  # REQUIRED: tag/digest-built revision compatible with this chart; see deployment contract.
    pullPolicy: Always
  port: 5001
  # Registry Center URL (auto-discovered if registry.enabled=true)
  agentRegistryUrl: ""
  # LLM configuration for orchestration-center
  llm:
    chat:
      model: "your-chat-model"
      url: "https://your-llm-provider.com/v1/chat/completions"
      apiKey: ""
      existingSecret: ""
      existingSecretKey: "orchestration-llm-chat-api-key"
  # Resource limits
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # HPA
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  # Probes
  livenessProbe:
    exec:
      command: ["python", "-m", "orchestrate.server.healthcheck"]
    initialDelaySeconds: 40
    periodSeconds: 30
    timeoutSeconds: 10
  readinessProbe:
    exec:
      command: ["python", "-m", "orchestrate.server.healthcheck"]
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
  startupProbe:
    exec:
      command: ["python", "-m", "orchestrate.server.healthcheck"]
    failureThreshold: 12
    periodSeconds: 10

# =============================================================================
# Workflow Designer Configuration (Frontend)
# =============================================================================
frontend:
  backendTls:
    verifyServer: true
    existingSecret: ""  # trust.cer; client.cer/client_key.pem when OC requires mTLS
  # Set to false to skip workflow-designer deployment
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/project-openan/workflow-designer
    tag: ""  # REQUIRED: tag/digest-built revision compatible with this chart; see deployment contract.
    pullPolicy: Always
  port: 80
  nodePort: 30191
  # Empty uses the protocol-aware managed template. Advanced overrides are Helm templates.
  nginxConfig: ""
  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # HPA
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  # Probes
  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10

# =============================================================================
# Ingress Configuration
# =============================================================================
ingress:
  backendVerifyServer: true  # HTTPS upstream requires per-service ingressClientSecret (ca.crt)
  enabled: true
  className: nginx
  # host: Set to a DNS name for host-based routing, or leave empty for IP-based path routing
  # Examples: "openan.local" for DNS, "" for direct IP access (e.g., http://<LB_IP>/)
  host: ""
  # TLS configuration
  tls:
    enabled: false
    secretName: openan-tls
  # Annotations
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
# Primary SQL type and hosting are separate choices. MySQL is external only.
database:
  type: postgresql
  host: ""  # Required for mysql; PostgreSQL falls back to postgresql.externalHost
  port: null  # External SQL only: null selects PostgreSQL 5432 / MySQL 3306; integer 1..65535.
  registry:
    name: registry_center
    username: registry
    existingSecret: ""
    passwordKey: db-password
  orchestration:
    name: orchestration_center
    username: opena2a_t
    existingSecret: ""
    passwordKey: db-password
